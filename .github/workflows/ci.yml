name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      USE_MOCK_API: "true" # o build não depende do back-end

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # lê a versão do campo packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true # TODO: remover depois do PR que corrige os erros de lint

      - name: Build
        run: pnpm build
